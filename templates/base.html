<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fachtest-Spiel Sozialwesen{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f6f4ef; }
    .brand { color: #2f6f5e; }
    .choice-btn { text-align: left; white-space: normal; }
    .trust .progress-bar { background: #2f6f5e; transition: width .6s ease; }
  </style>
</head>
<body>
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container" style="max-width: 760px">
      <a class="navbar-brand brand fw-semibold" href="{% url 'szenario:index' %}">
        <i class="bi bi-people"></i> Fachtest-Spiel Sozialwesen
      </a>
      {% if user.is_staff %}
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'szenario:protocol_list' %}">
          <i class="bi bi-clipboard-data"></i> Protokolle
        </a>
      {% endif %}
    </div>
  </nav>
  <main class="container pb-5" style="max-width: 760px">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
